<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAT 171 Visual Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F4FA; --card:#FFFFFF; --ink:#18202E; --mute:#566176; --line:#D9E0EE; --soft:#E7ECF6;
  --ok:#17804F; --bad:#C8383A; --okbg:#E3F5EC; --badbg:#FBE8E8;
  --c1:#EF5B5B; --d1:#C23A3A; --c2:#F5A524; --d2:#A65F00; --c3:#2FB67C; --d3:#167A50;
  --c4:#1FA7B5; --d4:#11727D; --c5:#3B7BF6; --d5:#2457C9; --c6:#7B5CF0; --d6:#5A3DD1;
  --c7:#E253A8; --d7:#B52D82;
  --shadow:0 1px 2px rgba(24,32,46,.06),0 6px 18px rgba(24,32,46,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --card:#171F33; --ink:#EAF0FB; --mute:#A0ADC4; --line:#2B3652; --soft:#1F2A43;
    --ok:#4CCB8D; --bad:#FF7B7B; --okbg:#123424; --badbg:#3A1C20; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --card:#171F33; --ink:#EAF0FB; --mute:#A0ADC4; --line:#2B3652; --soft:#1F2A43;
  --ok:#4CCB8D; --bad:#FF7B7B; --okbg:#123424; --badbg:#3A1C20; --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.m,.eq,.fm{font-family:"STIX Two Text","Cambria Math","Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tc,var(--c5));outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;background:none;border:0;padding:4px 0;text-align:left}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.sp{flex:1}
.pill{font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;color:var(--mute);white-space:nowrap}
.pill.cloud{color:var(--ok);border-color:var(--ok)}
.pill.err{color:var(--bad);border-color:var(--bad)}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14px}

/* home */
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.12;margin:0 0 10px;letter-spacing:-.02em;max-width:18ch}
.hero p{margin:0;color:var(--mute);max-width:56ch}
.overall{margin:22px 0 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1;min-width:160px;max-width:420px}
.bar i{display:block;height:100%;background:var(--tc,var(--c5));border-radius:99px;transition:width .4s}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:20px}
.tile{--tx:var(--tcd);text-align:left;padding:0;border:2px solid var(--line);background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.tile:hover{border-color:var(--tc);transform:translateY(-2px)}
.tile .gl{background:color-mix(in srgb,var(--tc) 16%,var(--card));padding:14px 14px 6px}
.tile .gl svg{width:100%;height:92px;display:block}
.tile .tb{padding:12px 16px 16px}
.tile h3{margin:0 0 2px;font-size:18px;color:var(--tx)}
.tile p{margin:0 0 10px;font-size:14px;color:var(--mute);line-height:1.45}
.tile .bar{height:8px;max-width:none}
.tile .cnt{font-size:13px;color:var(--mute);margin-top:6px}
.how{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:15px}
.how b{color:var(--ink)}
.how span.ar{opacity:.5}
.foot{margin-top:40px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute)}
.foot button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:13px}

/* topic view */
.tview{--tx:var(--tcd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tview,:root:not([data-theme="light"]) .tile{--tx:var(--tc)}}
:root[data-theme="dark"] .tview,:root[data-theme="dark"] .tile{--tx:var(--tc)}
.back{border:0;background:none;color:var(--mute);padding:14px 0 4px;font-size:15px}
.thead{background:color-mix(in srgb,var(--tc) 15%,var(--card));border:2px solid color-mix(in srgb,var(--tc) 45%,var(--card));border-radius:24px;padding:22px 24px;margin:6px 0 18px}
.thead h2{margin:0 0 4px;font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;color:var(--tx)}
.thead p{margin:0;max-width:60ch}
.conf{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.conf .cb{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-size:14px}
.conf .cb[aria-pressed="true"]{color:#fff;border-color:transparent}
.conf .cb.g[aria-pressed="true"]{background:var(--d3)}
.conf .cb.y[aria-pressed="true"]{background:var(--d2)}
.conf .cb.r[aria-pressed="true"]{background:var(--d1)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--tcd);color:#fff;border-color:var(--tcd)}
h3.gh{font-size:19px;margin:28px 0 12px;color:var(--tx)}
.lead{color:var(--mute);margin:0 0 14px}

/* widget */
.wg{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.wg{grid-template-columns:1fr}}
.wg-plot,.wg-side{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.wg-plot svg{width:100%;height:auto;display:block}
.wg-info{font-size:15px;line-height:1.55;min-height:96px}
.wg-info p{margin:0 0 8px}
.eq{font-size:21px;margin:0 0 6px;color:var(--tx)}
.wg-ctl{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:10px}
.ctl{display:grid;gap:2px;font-size:14px;color:var(--mute)}
.ctl.chk{display:flex;align-items:center;gap:10px}
.ctl input[type=range]{width:100%;accent-color:var(--tcd)}
.ctl .val{color:var(--tx);font-weight:600}
.ctl select{font:inherit;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.ctl input[type=checkbox]{width:20px;height:20px;accent-color:var(--tcd)}
.notice{margin-top:18px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:16px;padding:14px 18px}
.notice b{color:var(--tx)}
.notice ul{margin:6px 0 0;padding-left:20px}

/* svg bits */
.gl0{stroke:var(--line);stroke-width:1}
.ax{stroke:var(--mute);stroke-width:1.6}
.gt{fill:var(--mute);font-size:11px;font-family:"Lexend",sans-serif}
.cv{fill:none;stroke:var(--tcd);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .cv{stroke:var(--tc)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cv{stroke:var(--tc)}}
.cv2{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cv3{fill:none;stroke:var(--c1);stroke-width:3;stroke-linecap:round}
.base{fill:none;stroke:var(--mute);stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round}
.asy{stroke:var(--c1);stroke-width:2;stroke-dasharray:7 6}
.asyb{stroke:var(--c5);stroke-width:2;stroke-dasharray:7 6}
.dot{fill:var(--tcd);stroke:var(--card);stroke-width:2}
.dot.open{fill:var(--card);stroke:var(--tcd);stroke-width:3}
:root[data-theme="dark"] .dot{fill:var(--tc)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot{fill:var(--tc)}}
.lab{fill:var(--ink);font-size:12px;font-weight:600;font-family:"Lexend",sans-serif}
.lab.mu{fill:var(--mute);font-weight:400}
.nl{width:100%;height:auto;display:block;margin-top:6px}
.nll{stroke:var(--mute);stroke-width:2}
.nlt{stroke:var(--mute);stroke-width:1.5}
.nlx{fill:var(--mute);font-size:11px;font-family:"Lexend",sans-serif}
.sh{fill:color-mix(in srgb,var(--tc) 55%,transparent)}
.sh.neg{fill:color-mix(in srgb,var(--c1) 55%,transparent)}
.mini{width:100%;height:auto;display:block}
.mx{stroke:var(--line);stroke-width:1.5}
.ar{stroke:var(--card);stroke-width:2}
.k1{fill:color-mix(in srgb,var(--c1) 55%,var(--card))}
.k2{fill:color-mix(in srgb,var(--c5) 55%,var(--card))}
.k3{fill:color-mix(in srgb,var(--c3) 55%,var(--card))}
.k4{fill:color-mix(in srgb,var(--c2) 60%,var(--card))}
.art{fill:var(--ink);font-size:14px;font-weight:600;font-family:"STIX Two Text",serif}

/* know cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.pc h4{margin:0 0 6px;font-size:16px}
.pc .fm{font-size:20px;color:var(--tx);margin:0 0 6px;line-height:1.35}
.pc p{margin:0 0 6px;font-size:15px;color:var(--mute);line-height:1.5}
.pc .ex{font-family:"STIX Two Text",serif;font-size:17px;background:var(--soft);border-radius:10px;padding:6px 10px;margin-top:8px}
.pc .vz{margin-top:8px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 8px;align-items:stretch}
.flow li{position:relative;background:var(--card);border:2px solid var(--tc);border-radius:14px;padding:10px 14px;font-size:15px;max-width:260px}
.flow li b{display:block;color:var(--tx)}
.flow li:not(:last-child)::after{content:"\203A";position:absolute;right:-14px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--tc);font-weight:700}
.flow li{margin-right:14px}
@media (max-width:620px){.flow{flex-direction:column}.flow li{max-width:none;margin-right:0}.flow li:not(:last-child)::after{content:"\2193";right:auto;left:20px;top:auto;bottom:-24px;transform:none}.flow{gap:26px}}

/* walkthrough */
.steps{display:grid;gap:12px}
.st{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.st .nb{width:44px;height:44px;border-radius:50%;background:var(--tcd);color:#fff;display:grid;place-items:center;font-weight:700}
.st .do{font-weight:600}
.st .mt{font-family:"STIX Two Text",serif;font-size:22px;color:var(--tx);margin:4px 0}
.st .wy{color:var(--mute);font-size:15px}
.st .vz{margin-top:8px;max-width:520px}
.st table{border-collapse:collapse;font-family:"STIX Two Text",serif;font-size:20px}
.st td{padding:4px 12px;text-align:center}
.st td.rt{border-right:2px solid var(--ink);color:var(--tx);font-weight:600}
.st tr.sum td{border-top:2px solid var(--ink)}
.walkbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:2px solid var(--tcd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 20px;font-weight:600}
.btn.fill{background:var(--tcd);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}

/* practice */
.qs{display:grid;gap:16px}
.q{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--tc);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.q.ok{border-left-color:var(--ok)}
.q.bad{border-left-color:var(--bad)}
.q .qt{font-size:18px;margin:0 0 12px}
.q .qt .m{font-size:21px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 14px;font-family:"STIX Two Text",serif;font-size:20px}
.opt:hover{border-color:var(--tc)}
.opt .lt{font-family:"Lexend",sans-serif;font-size:13px;font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.ans{display:flex;gap:10px;flex-wrap:wrap}
.ans input{font:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:min(260px,100%)}
.ans input.right{border-color:var(--ok);background:var(--okbg)}
.ans input.wrong{border-color:var(--bad);background:var(--badbg)}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14px}
.qa button.go{background:var(--tcd);color:#fff;border-color:var(--tcd);font-weight:600}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ink);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb.hint{background:var(--soft)}
.fb .m{font-size:19px}
.self-r{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

/* tutor */
.trow{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.trow h3{margin:0 0 8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tc1{border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:10px;padding:6px 10px;font-size:13px}
.tc1 b{display:block;font-size:14px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px;color:#fff}
.tag.g{background:var(--d3)}.tag.y{background:var(--d2)}.tag.r{background:var(--d1)}
.miss{font-size:14px;color:var(--mute);margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* proper powers and fractions */
sup{font-size:.72em;line-height:0;position:relative;vertical-align:baseline;top:-.5em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.86em;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
sup .fr{font-size:1em;vertical-align:baseline;line-height:1.05}
sup.frsup{font-size:.72em;display:inline-block;vertical-align:top;position:relative;top:-.55em;margin:0 .1em 0 .06em;line-height:1}
sup.frsup .fr{vertical-align:top}
sup.frsup .fr{margin:0}
sup.frsup .fr>span:first-child{border-bottom-width:1.2px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--soft);padding:1px 6px;border-radius:6px}
/* practice test */
.ptest{display:flex;align-items:center;gap:16px;width:100%;text-align:left;margin-top:20px;padding:18px 22px;border-radius:22px;border:2px solid var(--d5);background:var(--card);color:var(--ink);box-shadow:var(--shadow);font:inherit}
.ptest:hover{border-color:var(--c5)}
.ptest .pi{flex:none;width:52px;height:52px;border-radius:16px;background:var(--d5);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.ptest b{display:block;font-size:20px;margin-bottom:2px}
.ptest span.d{color:var(--mute);font-size:15px}
.ptest .ar{margin-left:auto;font-size:28px;color:var(--d5)}
.tbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,76px));z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--bg);padding:10px 0;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tbar .pt{font-weight:700;font-size:18px}
.tbar .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.tbar .tm.low{border-color:var(--bad);color:var(--bad)}
.tbar .cnt{color:var(--mute);font-size:15px}
.tnum{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tcd);margin-bottom:6px}
.opt.sel{border-color:var(--d5);background:var(--soft)}
.tsub{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.tcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.tcard.main{border-color:var(--d5)}
.tcard h3{margin:0 0 6px;font-size:20px}
.tcard p{margin:0 0 10px;color:var(--mute)}
.tcard ul{margin:0 0 12px;padding-left:20px;display:grid;gap:4px}
.tparts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:14px 0}
.tparts .tcard{margin:0}
.tst{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--mute)}
.tst.done{background:var(--okbg);color:var(--ok)}
.tst.now{background:var(--d5);color:#fff}
.big{font-size:clamp(32px,6vw,46px);font-weight:700;line-height:1;margin:4px 0 6px}
.big small{font-size:18px;font-weight:500;color:var(--mute)}
.tbt{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.tbt a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:12px;padding:8px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.tbt a b{display:block;font-size:14px}
.tbt a.weak{border-left-color:var(--bad)}
.tset{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 4px}
.tset select{font:inherit;font-size:15px;padding:7px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.fbk{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--soft);border-left:6px solid var(--fbc);font-size:16px}
.pfinal{border-color:var(--ink)}.pfinal .pi{background:var(--ink);font-size:18px}.pfinal .ar{color:var(--ink)}
.fnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:0 0 18px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.fnav button{font:inherit;font-size:14px;font-variant-numeric:tabular-nums;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;position:relative}
.fnav button.an{background:var(--d5);border-color:var(--d5);color:#fff}
.fnav button.fl::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#e8a317;box-shadow:0 0 0 1.5px var(--card)}
.fqh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.fqh .tnum{margin:0}
.fmapb{padding:6px 12px;font-size:14px;margin-left:auto}.tbar .fmapb+.tm{margin-left:0}
.fflag{font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.fflag.on{border-color:#e8a317;color:var(--ink);background:rgba(232,163,23,.15)}
.fq{scroll-margin-top:150px}
.ftbl{overflow-x:auto}.ftbl table{border-collapse:collapse;font-size:15px;min-width:280px}.ftbl th,.ftbl td{text-align:left;padding:6px 14px 6px 0;border-bottom:1px solid var(--line)}.ftbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.ftbl td.n{font-variant-numeric:tabular-nums}
.fscore{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.fgrade{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:46px;font-weight:700;background:var(--d5);color:#fff}
.exchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 18px}
.exchips button{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.exchips button b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tcd)}
.exchips button span{font-size:14px;line-height:1.35;color:var(--mute)}
.exchips button[aria-selected="true"]{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc);background:var(--soft)}
.exchips button[aria-selected="true"] span{color:var(--ink)}
</style>

<body>
<header class="top"><div class="wrap">
  <button class="brand" data-act="home">MAT 171 Visual Study Guide<small>Precalculus Algebra &middot; CPCC</small></button>
  <span class="sp"></span>
  <span id="pill" class="pill">Saved on this device</span>
  <button id="tbtn" class="tbtn" data-act="tutor" hidden>Tutor view</button>
</div></header>
<main class="wrap" id="main" aria-live="polite"></main>

<script>
(()=>{
'use strict';
/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=v=>{let s=(Math.round(v*100)/100).toString();return s.replace('-','\u2212');};
const sg=(v,t)=>{ // signed term like " + 3x" or " − 2"
  if(v===0)return '';const a=Math.abs(v);const c=(a===1&&t)?'':f2(a);return (v<0?' \u2212 ':' + ')+c+t;};
const nice=(r,max)=>{for(const s of [1,2,5,10,20,50,100])if(r/s<=max)return s;return 200;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- graph helpers ---------- */
function mkG(w,h,x0,x1,y0,y1){return{w,h,x0,x1,y0,y1,sx:x=>(x-x0)/(x1-x0)*w,sy:y=>h-(y-y0)/(y1-y0)*h};}
function axes(g){
  const xs=nice(g.x1-g.x0,14),ys=nice(g.y1-g.y0,14);let s='';
  const lx=(g.x1-g.x0)/xs>8,ly=(g.y1-g.y0)/ys>8;
  for(let t=Math.ceil(g.x0/xs)*xs;t<=g.x1+1e-9;t+=xs){
    s+=`<line class="${t===0?'ax':'gl0'}" x1="${g.sx(t).toFixed(1)}" y1="0" x2="${g.sx(t).toFixed(1)}" y2="${g.h}"/>`;
    if(t!==0&&(!lx||(t/xs)%2===0))s+=`<text class="gt" x="${g.sx(t).toFixed(1)}" y="${clamp(g.sy(0)+14,12,g.h-4).toFixed(1)}" text-anchor="middle">${f2(t)}</text>`;}
  for(let t=Math.ceil(g.y0/ys)*ys;t<=g.y1+1e-9;t+=ys){
    s+=`<line class="${t===0?'ax':'gl0'}" x1="0" y1="${g.sy(t).toFixed(1)}" x2="${g.w}" y2="${g.sy(t).toFixed(1)}"/>`;
    if(t!==0&&(!ly||(t/ys)%2===0))s+=`<text class="gt" x="${clamp(g.sx(0)-6,22,g.w-4).toFixed(1)}" y="${(g.sy(t)+4).toFixed(1)}" text-anchor="end">${f2(t)}</text>`;}
  return s;
}
function curve(g,fn,cls,o){
  o=o||{};const n=o.n||520;let d='',pen=false,py=null;
  for(let i=0;i<=n;i++){
    const x=g.x0+(g.x1-g.x0)*i/n;let y;try{y=fn(x);}catch(e){y=NaN;}
    if(!isFinite(y)||Math.abs(y)>1e4){pen=false;py=null;continue;}
    if(py!==null&&Math.abs(y-py)>(g.y1-g.y0)*(o.jump||0.7))pen=false;
    d+=(pen?'L':'M')+g.sx(x).toFixed(1)+' '+g.sy(y).toFixed(1);pen=true;py=y;}
  return d?`<path class="${cls}" d="${d}"/>`:'';
}
const vline=(g,x,c)=>`<line class="${c||'asy'}" x1="${g.sx(x).toFixed(1)}" y1="0" x2="${g.sx(x).toFixed(1)}" y2="${g.h}"/>`;
const hline=(g,y,c)=>`<line class="${c||'asyb'}" x1="0" y1="${g.sy(y).toFixed(1)}" x2="${g.w}" y2="${g.sy(y).toFixed(1)}"/>`;
const pt=(g,x,y,open)=>`<circle class="dot${open?' open':''}" cx="${g.sx(x).toFixed(1)}" cy="${g.sy(y).toFixed(1)}" r="6.5"/>`;
const tx=(g,x,y,t,cls,dx,dy)=>`<text class="lab ${cls||''}" x="${(g.sx(x)+(dx||0)).toFixed(1)}" y="${(g.sy(y)+(dy||0)).toFixed(1)}">${t}</text>`;
const svgWrap=(g,inner,label)=>`<svg class="gr" viewBox="0 0 ${g.w} ${g.h}" role="img" aria-label="${esc(label||'graph')}">${inner}</svg>`;
function mini(fns,o){
  o=o||{};const w=o.w||120,h=o.h||88;const g=mkG(w,h,o.x0===undefined?-3:o.x0,o.x1===undefined?3:o.x1,o.y0===undefined?-3:o.y0,o.y1===undefined?3:o.y1);
  let s=`<line class="mx" x1="0" y1="${g.sy(0)}" x2="${w}" y2="${g.sy(0)}"/><line class="mx" x1="${g.sx(0)}" y1="0" x2="${g.sx(0)}" y2="${h}"/>`;
  fns.forEach(f=>{s+=curve(g,f[0],f[1]||'cv',{n:140});});
  return `<svg class="mini" viewBox="0 0 ${w} ${h}" aria-hidden="true">${s}</svg>`;
}
function nl(o){
  const w=520,h=64,pad=o.pad===undefined?18:o.pad,y=32;
  const sx=x=>pad+(x-o.min)/(o.max-o.min)*(w-2*pad);
  let s=`<svg class="nl" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label||'number line')}">`;
  (o.shade||[]).forEach(r=>{const A=r[0]===-Infinity?0:sx(r[0]),B=r[1]===Infinity?w:sx(r[1]);s+=`<rect class="sh ${r[2]||''}" x="${A.toFixed(1)}" y="${y-6}" width="${Math.max(0,B-A).toFixed(1)}" height="12" rx="6"/>`;});
  s+=`<line class="nll" x1="0" y1="${y}" x2="${w}" y2="${y}"/>`;
  const st=o.step||1;
  for(let t=Math.ceil(o.min);t<=o.max;t+=st){s+=`<line class="nlt" x1="${sx(t).toFixed(1)}" y1="${y-5}" x2="${sx(t).toFixed(1)}" y2="${y+5}"/>`;
    if((t-Math.ceil(o.min))%(o.lab||st)===0)s+=`<text class="nlx" x="${sx(t).toFixed(1)}" y="${y+22}" text-anchor="middle">${f2(t)}</text>`;}
  (o.pts||[]).forEach(p=>{s+=`<circle class="dot${p.open?' open':''}" cx="${sx(p.x).toFixed(1)}" cy="${y}" r="6.5"/>`;});
  return s+'</svg>';
}

/* ---------- widget runner ---------- */
function runWidget(el,spec){
  const s={};spec.c.forEach(c=>{s[c.k]=c.v;});
  el.innerHTML='<div class="wg"><div class="wg-plot"></div><div class="wg-side"><div class="wg-info" aria-live="polite"></div><div class="wg-ctl"></div></div></div>';
  const plot=el.querySelector('.wg-plot'),info=el.querySelector('.wg-info'),ctl=el.querySelector('.wg-ctl');const inputs={};
  spec.c.forEach(c=>{
    const row=document.createElement('label');row.className='ctl';
    if(c.type==='select'){
      row.innerHTML=`<span>${c.label}</span><select>${c.opts.map(o=>`<option value="${o[0]}"${o[0]===c.v?' selected':''}>${o[1]}</option>`).join('')}</select>`;
      const i=row.querySelector('select');i.addEventListener('change',()=>{s[c.k]=i.value;draw();});inputs[c.k]=i;
    }else if(c.type==='check'){
      row.className='ctl chk';row.innerHTML=`<input type="checkbox"${c.v?' checked':''}><span>${c.label}</span>`;
      const i=row.querySelector('input');i.addEventListener('change',()=>{s[c.k]=i.checked;draw();});inputs[c.k]=i;
    }else{
      row.innerHTML=`<span>${c.label}: <b class="val"></b></span><input type="range" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${c.v}">`;
      const i=row.querySelector('input'),vb=row.querySelector('.val');
      const upd=()=>{s[c.k]=parseFloat(i.value);vb.textContent=f2(s[c.k]);};
      i.addEventListener('input',()=>{upd();draw();});upd();inputs[c.k]=i;
    }
    ctl.appendChild(row);
  });
  function draw(){const r=spec.draw(s);plot.innerHTML=r.svg;info.innerHTML=r.info;if(spec.after)spec.after(s,inputs);}
  draw();
}

/* ---------- widgets ---------- */
const W={};
W.t1={c:[{k:'a',label:'Side strip a',min:1,max:6,v:3},{k:'b',label:'Side strip b',min:1,max:6,v:2}],
 draw(s){
  const a=s.a,b=s.b,u=17,X=120,ox=30,oy=26;const W0=270,H0=270;
  const R=(x,y,w,h,cls,t)=>`<rect class="ar ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`+((w>=30&&h>=20)?`<text class="art" x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle">${t}</text>`:'');
  let g=R(ox,oy,X,X,'k1','x\u00B2')+R(ox+X,oy,b*u,X,'k2',b+'x')+R(ox,oy+X,X,a*u,'k3',a+'x')+R(ox+X,oy+X,b*u,a*u,'k4',a*b);
  g+=`<text class="lab" x="${ox+X/2}" y="16" text-anchor="middle">x</text><text class="lab" x="${ox+X+b*u/2}" y="16" text-anchor="middle">${b}</text>`;
  g+=`<text class="lab" x="14" y="${oy+X/2+4}" text-anchor="middle">x</text><text class="lab" x="14" y="${oy+X+a*u/2+4}" text-anchor="middle">${a}</text>`;
  return{svg:`<svg class="gr" viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Area model of (x+${a})(x+${b})">${g}</svg>`,
   info:`<p class="eq">(x + ${a})(x + ${b})</p><p class="eq">= x\u00B2 + ${a+b}x + ${a*b}</p>
   <p>The rectangle has width <b>x + ${b}</b> and height <b>x + ${a}</b>. Its four pieces are the four terms you get when you multiply.</p>
   <p>The two side strips (${b}x and ${a}x) <b>add</b> to make the middle term, ${a+b}x. The corner (${a}\u00B7${b}) is the last term, ${a*b}.</p>
   <p><b>Factoring is this picture backwards:</b> to factor x\u00B2 + ${a+b}x + ${a*b}, find two numbers that multiply to ${a*b} and add to ${a+b}.${a===b?' Both strips match, so this is a perfect square.':''}</p>`};
 }};
W.t2={c:[{k:'b',label:'b (the x term)',min:-6,max:6,v:-1},{k:'c',label:'c (the number)',min:-8,max:8,v:-6}],
 draw(s){
  const b=s.b,c=s.c,g=mkG(520,330,-8,8,-10,10),disc=b*b-4*c;
  const f=x=>x*x+b*x+c;let inner=axes(g)+curve(g,f,'cv');let nlx,txt;
  const eqs=`y = x\u00B2${sg(b,'x')}${sg(c,'')}`;
  if(disc>0){
    const r1=(-b-Math.sqrt(disc))/2,r2=(-b+Math.sqrt(disc))/2;
    inner+=pt(g,r1,0)+pt(g,r2,0);
    nlx=nl({min:-8,max:8,lab:2,pts:[{x:r1},{x:r2}],shade:[[r1,r2,''],[-Infinity,r1,'neg'],[r2,Infinity,'neg']],label:'Where the parabola is below and above zero'});
    txt=`<p class="eq">${eqs}</p><p>Discriminant b\u00B2 \u2212 4c = <b>${f2(disc)}</b> (positive), so there are <b>two</b> x-intercepts: x = ${f2(r1)} and x = ${f2(r2)}.</p>
    <p><b style="color:var(--tx)">Colored</b> = f(x) &lt; 0 (below the axis): <span class="m">(${f2(r1)}, ${f2(r2)})</span></p>
    <p><b style="color:var(--bad)">Red</b> = f(x) &gt; 0 (above the axis): <span class="m">(\u2212\u221E, ${f2(r1)}) \u222A (${f2(r2)}, \u221E)</span></p>`;
  }else if(disc===0){
    const r=-b/2;inner+=pt(g,r,0);
    nlx=nl({min:-8,max:8,lab:2,pts:[{x:r}],shade:[[-Infinity,r,'neg'],[r,Infinity,'neg']],label:'Parabola touches zero at one point'});
    txt=`<p class="eq">${eqs}</p><p>Discriminant = <b>0</b>, so the parabola just <b>touches</b> the x-axis at x = ${f2(r)}. One repeated solution.</p><p>f(x) is never below zero here.</p>`;
  }else{
    nlx=nl({min:-8,max:8,lab:2,shade:[[-Infinity,Infinity,'neg']],label:'Parabola is above zero everywhere'});
    txt=`<p class="eq">${eqs}</p><p>Discriminant = <b>${f2(disc)}</b> (negative), so the parabola <b>never touches</b> the x-axis. No real solutions (the solutions are complex).</p><p>f(x) &gt; 0 for every x.</p>`;
  }
  return{svg:svgWrap(g,inner,'Parabola '+eqs)+nlx,info:txt};
 }};
const BASEF={
 sq:{n:'x\u00B2',f:x=>x*x,t:s=>`${s}\u00B2`},ab:{n:'|x|',f:x=>Math.abs(x),t:s=>`|${s}|`},
 rt:{n:'\u221Ax',f:x=>x<0?NaN:Math.sqrt(x),t:s=>`\u221A${s}`},cu:{n:'x\u00B3',f:x=>x*x*x,t:s=>`${s}\u00B3`},
 inv:{n:'1/x',f:x=>1/x,t:s=>`1/${s}`}};
W.t3={c:[{k:'fn',type:'select',label:'Parent function f(x)',v:'sq',opts:[['sq','x\u00B2'],['ab','|x|'],['rt','\u221Ax'],['cu','x\u00B3'],['inv','1/x']]},
 {k:'a',label:'a (stretch / flip)',min:-3,max:3,step:.5,v:1},{k:'h',label:'h (left / right)',min:-5,max:5,v:2},{k:'k',label:'k (down / up)',min:-5,max:5,v:1}],
 draw(s){
  const B=BASEF[s.fn],g=mkG(520,360,-8,8,-8,8);
  const T=x=>s.a*B.f(x-s.h)+s.k;
  const inside=s.h===0?'x':(s.h>0?`(x \u2212 ${f2(s.h)})`:`(x + ${f2(-s.h)})`);
  const aTxt=s.a===1?'':(s.a===-1?'\u2212':f2(s.a)+'\u00B7');
  const eq=`y = ${aTxt}${B.t(inside)}${sg(s.k,'')}`;
  const d=[];
  if(s.h!==0)d.push(`<b>${s.h>0?'Right':'Left'} ${f2(Math.abs(s.h))}</b> (inside the parentheses, so it moves the <i>opposite</i> of the sign)`);
  if(s.k!==0)d.push(`<b>${s.k>0?'Up':'Down'} ${f2(Math.abs(s.k))}</b>`);
  if(s.a<0)d.push('<b>Flipped</b> over the x-axis');
  if(Math.abs(s.a)>1)d.push(`<b>Stretched</b> taller by ${f2(Math.abs(s.a))}`);
  if(Math.abs(s.a)<1&&s.a!==0)d.push(`<b>Squished</b> flatter by ${f2(Math.abs(s.a))}`);
  if(s.a===0)d.push('a = 0 flattens everything into a line');
  const svg=svgWrap(g,axes(g)+curve(g,B.f,'base')+curve(g,T,'cv')+(s.fn==='inv'?'':''),'Transformed graph '+eq);
  return{svg,info:`<p class="eq">${eq}</p><p>Dashed gray is the parent f(x) = ${B.n}. The colored curve is what you built.</p><p>${d.length?d.join('<br>'):'No changes yet: move a slider.'}</p>`};
 }};
const nm=(r,s)=>{const x=Math.abs(r);const c=x===0?'x':(r>0?`(x \u2212 ${x})`:`(x + ${x})`);return c;};
W.t4={c:[{k:'r1',label:'Zero 1',min:-4,max:4,v:-3},{k:'r2',label:'Zero 2',min:-4,max:4,v:1},{k:'r3',label:'Zero 3',min:-4,max:4,v:3},
 {k:'a',type:'select',label:'Leading coefficient',v:'1',opts:[['1','positive'],['-1','negative']]}],
 draw(s){
  const a=parseFloat(s.a),rs=[s.r1,s.r2,s.r3].sort((p,q)=>p-q);
  const f=x=>a*(x-rs[0])*(x-rs[1])*(x-rs[2]);
  let mx=1;for(let x=-5.5;x<=5.5;x+=.1)mx=Math.max(mx,Math.abs(f(x)));
  const Y=clamp(Math.ceil(mx*1.1),6,120),g=mkG(520,360,-6,6,-Y,Y);
  const cnt={};rs.forEach(r=>{cnt[r]=(cnt[r]||0)+1;});
  let inner=axes(g)+curve(g,f,'cv');Object.keys(cnt).forEach(r=>{inner+=pt(g,+r,0);});
  const eq='f(x) = '+(a<0?'\u2212':'')+rs.map(r=>nm(r)).join('');
  const lines=Object.keys(cnt).map(Number).sort((p,q)=>p-q).map(r=>{const m=cnt[r];
    return `<p>x = <b>${r}</b>: ${m===1?'the graph <b>crosses</b> the axis (multiplicity 1)':m===2?'the graph <b>touches and turns back</b> (multiplicity 2)':'the graph <b>flattens as it crosses</b> (multiplicity 3)'}</p>`;}).join('');
  return{svg:svgWrap(g,inner,'Cubic polynomial '+eq),
   info:`<p class="eq">${eq}</p>${lines}<p>Degree 3, ${a>0?'positive':'negative'} leading coefficient: the left end goes <b>${a>0?'down':'up'}</b> and the right end goes <b>${a>0?'up':'down'}</b>.</p>`};
 }};
W.t5={c:[{k:'m',type:'select',label:'Top of the fraction',v:'2',opts:[['2','two factors (degree 2)'],['1','one factor (degree 1)'],['0','just the number k (degree 0)']]},
 {k:'k',label:'k (the multiplier)',min:-3,max:3,v:1},{k:'p',label:'Top zero p',min:-5,max:5,v:2},{k:'r',label:'Top zero r',min:-5,max:5,v:-2},
 {k:'q',label:'Bottom zero q',min:-5,max:5,v:2},{k:'t',label:'Bottom zero s',min:-5,max:5,v:-1}],
 draw(s){
  const k=s.k===0?1:s.k;const m=parseInt(s.m,10);
  let nr=[s.p,s.r].slice(0,m),dr=[s.q,s.t];const holes=[];
  for(let i=nr.length-1;i>=0;i--){const j=dr.indexOf(nr[i]);if(j>=0){holes.push(nr[i]);nr.splice(i,1);dr.splice(j,1);}}
  const f=x=>k*nr.reduce((a,r)=>a*(x-r),1)/dr.reduce((a,r)=>a*(x-r),1);
  const g=mkG(520,360,-8,8,-8,8);let inner=axes(g);
  const vas=[...new Set(dr)];vas.forEach(v=>{inner+=vline(g,v);});
  let ha=null;if(nr.length<dr.length)ha=0;else if(nr.length===dr.length)ha=k;
  if(ha!==null)inner+=hline(g,ha);
  inner+=curve(g,f,'cv',{jump:.5,n:900});
  const hl=[];holes.forEach(h=>{const y=f(h);if(isFinite(y)){inner+=pt(g,h,y,true);hl.push(`(${h}, ${f2(y)})`);}});
  const xi=[...new Set(nr)];xi.forEach(x=>{inner+=pt(g,x,0);});
  const num=[...(m>=1?[s.p]:[]),...(m>=2?[s.r]:[])].map(r=>nm(r)).join('')||'1';
  const eq=`f(x) = ${k===1?'':f2(k)+'\u00B7'}${m>0?num:'1'} / ${nm(s.q)}${nm(s.t)}`;
  const fy=isFinite(f(0))?f2(f(0)):'none';
  return{svg:svgWrap(g,inner,'Rational function '+eq),
   info:`<p class="eq">${eq}</p>
   <p><b style="color:var(--bad)">Vertical asymptotes</b> (red dashes): ${vas.length?vas.map(v=>'x = '+v).join(', '):'none'}</p>
   <p><b style="color:var(--c5)">Horizontal asymptote</b> (blue dashes): ${ha===null?'none':'y = '+f2(ha)}</p>
   <p><b>Holes</b> (open dots): ${hl.length?hl.join(', '):'none'}${holes.length?' \u2013 a factor cancelled, so there is no wall, just a missing point.':''}</p>
   <p><b>x-intercepts:</b> ${xi.length?xi.join(', '):'none'} &nbsp; <b>y-intercept:</b> ${fy}</p>
   <p class="lead">Tip: set a top zero equal to a bottom zero to make a hole.</p>`};
 }};
W.t6={c:[{k:'b',label:'Base b',min:.2,max:5,step:.1,v:2},{k:'lg',type:'check',label:'Show the log (inverse)',v:true},{k:'mr',type:'check',label:'Show the mirror line y = x',v:true}],
 draw(s){
  const b=Math.round(s.b*10)/10,g=mkG(440,440,-5,7,-5,7);let inner=axes(g);
  const flat=Math.abs(b-1)<.01;
  if(s.mr)inner+=`<line class="base" x1="${g.sx(-5)}" y1="${g.sy(-5)}" x2="${g.sx(7)}" y2="${g.sy(7)}"/>`;
  inner+=curve(g,x=>Math.pow(b,x),'cv',{n:600,jump:.9});
  inner+=pt(g,0,1)+pt(g,1,Math.min(b,6.9));
  if(s.lg&&!flat){inner+=curve(g,x=>x<=0?NaN:Math.log(x)/Math.log(b),'cv3',{n:600,jump:.9});inner+=pt(g,1,0)+pt(g,Math.min(b,6.9),1);inner+=vline(g,0);}
  inner+=hline(g,0,'asyb');
  const grow=b>1?'<b>growth</b> (b &gt; 1): rises to the right':'<b>decay</b> (0 &lt; b &lt; 1): falls to the right';
  return{svg:svgWrap(g,inner,'Exponential and logarithm with base '+b),
   info:flat?`<p class="eq">b = 1</p><p>A base of 1 is not allowed for an exponential function: 1 to any power is just 1, so the graph is a flat line. Move the slider.</p>`:
   `<p class="eq">y = ${f2(b)}<sup>x</sup> &nbsp;and&nbsp; y = log<sub>${f2(b)}</sub>(x)</p>
   <p>The colored curve is exponential: ${grow}. It passes through <b>(0, 1)</b> and <b>(1, ${f2(b)})</b> and never goes below the x-axis (horizontal asymptote y = 0).</p>
   ${s.lg?`<p>The red curve is its inverse, the log. The points flip: <b>(1, 0)</b> and <b>(${f2(b)}, 1)</b>. It has a vertical wall at x = 0, so you can only take the log of <b>positive</b> numbers.</p>`:'<p>Turn on the log to see the mirror image.</p>'}
   <p>Logs and exponentials are mirror images across the line y = x.</p>`};
 }};
W.t7={c:[{k:'mode',type:'select',label:'What to graph',v:'ll',opts:[['ll','Two lines'],['lp','A line and the parabola y = x\u00B2 \u2212 2']]},
 {k:'m1',label:'Line 1 slope',min:-4,max:4,step:.5,v:1},{k:'b1',label:'Line 1 y-intercept',min:-6,max:6,v:-1},
 {k:'m2',label:'Line 2 slope (lines mode)',min:-4,max:4,step:.5,v:-1},{k:'b2',label:'Line 2 y-intercept (lines mode)',min:-6,max:6,v:5}],
 after(s,inp){const d=s.mode==='lp';inp.m2.disabled=d;inp.b2.disabled=d;},
 draw(s){
  const g=mkG(520,360,-8,8,-8,8);let inner=axes(g);
  const L1=x=>s.m1*x+s.b1,L2=x=>s.m2*x+s.b2;let txt;
  inner+=curve(g,L1,'cv');
  if(s.mode==='ll'){
    inner+=curve(g,L2,'cv3');
    if(s.m1===s.m2){txt=s.b1===s.b2?`<p><b>Infinitely many solutions.</b> Both equations are the same line.</p>`:`<p><b>No solution.</b> The lines have the same slope, so they are parallel and never meet.</p>`;}
    else{const x=(s.b2-s.b1)/(s.m1-s.m2),y=L1(x);inner+=pt(g,x,y);txt=`<p><b>One solution:</b> the lines cross at</p><p class="eq">(${f2(x)}, ${f2(y)})</p><p>Different slopes always cross exactly once.</p>`;}
    txt=`<p class="eq">y = ${f2(s.m1)}x${sg(s.b1,'')}</p><p class="eq" style="color:var(--bad)">y = ${f2(s.m2)}x${sg(s.b2,'')}</p>`+txt;
  }else{
    inner+=curve(g,x=>x*x-2,'cv3');
    const A=1,B=-s.m1,C=-(2+s.b1),d=B*B-4*A*C;const ps=[];
    if(d>=0){const r=d===0?[-B/2]:[(-B-Math.sqrt(d))/2,(-B+Math.sqrt(d))/2];r.forEach(x=>{const y=L1(x);inner+=pt(g,x,y);ps.push(`(${f2(x)}, ${f2(y)})`);});}
    txt=`<p class="eq">y = ${f2(s.m1)}x${sg(s.b1,'')}</p><p class="eq" style="color:var(--bad)">y = x\u00B2 \u2212 2</p>`+
      (ps.length?`<p><b>${ps.length===2?'Two solutions':'One solution (the line just touches)'}:</b> ${ps.join(' and ')}</p>`:`<p><b>No solution.</b> The line misses the parabola.</p>`)+
      `<p>Set them equal: x\u00B2 \u2212 2 = ${f2(s.m1)}x${sg(s.b1,'')}. The discriminant tells you how many solutions: ${f2(d)}.</p>`;
  }
  return{svg:svgWrap(g,inner,'System of equations'),info:txt};
 }};

  {id:'3f',t:'self',q:'Find the domain of h(x) = \u221A(x + 1) / (x \u2212 2).',ans:'[\u22121, 2) \u222A (2, \u221E)',hint:'Two red flags: the square root needs x + 1 \u2265 0, and the bottom cannot be 0.',sol:'x \u2265 \u22121 from the root, and x \u2260 2 from the denominator. In interval notation: [\u22121, 2) \u222A (2, \u221E).'}]},

{id:'t4',n:'Polynomial functions',goal:'Polynomials are smooth curves. The zeros are where they hit the x-axis.',

  {h:'End behavior: the ends only depend on the leading term',cards:[
   {t:'Odd degree, positive',f:'falls left, rises right',n:'Like x\u00B3.',viz:mini([[x=>x*x*x/9]])},
   {t:'Odd degree, negative',f:'rises left, falls right',n:'Like \u2212x\u00B3.',viz:mini([[x=>-x*x*x/9]])},
   {t:'Even degree, positive',f:'both ends up',n:'Like x\u00B2.',viz:mini([[x=>x*x/3-2]])},
   {t:'Even degree, negative',f:'both ends down',n:'Like \u2212x\u00B2.',viz:mini([[x=>-x*x/3+2]])}]},
  {h:'Multiplicity: what happens at a zero',cards:[
   {t:'Multiplicity 1',f:'(x \u2212 1)',n:'Crosses the axis straight through.',viz:mini([[x=>x*1.2]])},
   {t:'Multiplicity 2',f:'(x \u2212 1)\u00B2',n:'Touches the axis and turns around.',viz:mini([[x=>x*x/3]],{y0:-1.5,y1:3})},
   {t:'Multiplicity 3',f:'(x \u2212 1)\u00B3',n:'Flattens out as it crosses.',viz:mini([[x=>x*x*x/9]])}]},
  {h:'Key theorems',cards:[
   {t:'Remainder Theorem',f:'f(x) \u00F7 (x \u2212 c) has remainder f(c)',n:'To find the remainder, just plug c into the function.'},
   {t:'Factor Theorem',f:'f(c) = 0  \u21D4  (x \u2212 c) is a factor',n:'If plugging in c gives zero, c is a zero and (x \u2212 c) divides evenly.'},
   {t:'Rational Root Theorem',f:'\u00B1 (factors of constant) / (factors of leading)',n:'This builds your list of possible rational zeros to test.',ex:'2x\u00B3 + \u2026 \u2212 6: \u00B11, \u00B12, \u00B13, \u00B16, \u00B11/2, \u00B13/2'},
   {t:'Fundamental Theorem',f:'degree n \u2192 n zeros',n:'Counting multiplicity and complex numbers, a degree n polynomial has exactly n zeros. Complex zeros come in conjugate pairs: a + bi and a \u2212 bi.'}]}],
 flow:[['Step 1','List possible zeros \u00B1p/q'],['Step 2','Test one with synthetic division'],['Step 3','Remainder 0? You found a zero'],['Step 4','Repeat on the quotient'],['Step 5','Finish with factoring or the formula']],
 ex:{title:'Find all zeros of f(x) = x\u00B3 \u2212 2x\u00B2 \u2212 5x + 6',steps:[
  {d:'List the possible rational zeros',m:'\u00B11, \u00B12, \u00B13, \u00B16',w:'Factors of the constant 6 over factors of the leading coefficient 1.'},
  {d:'Test x = 1',m:'f(1) = 1 \u2212 2 \u2212 5 + 6 = 0',w:'Zero! So (x \u2212 1) is a factor.'},
  {d:'Divide with synthetic division',m:'',w:'Bring down the 1. Multiply by 1 and add, again and again.',viz:'<table aria-label="Synthetic division"><tr><td class="rt">1</td><td>1</td><td>\u22122</td><td>\u22125</td><td>6</td></tr><tr><td class="rt"></td><td></td><td>1</td><td>\u22121</td><td>\u22126</td></tr><tr class="sum"><td class="rt"></td><td>1</td><td>\u22121</td><td>\u22126</td><td>0</td></tr></table>'},
  {d:'Read the quotient',m:'x\u00B2 \u2212 x \u2212 6',w:'The last number (0) is the remainder. The others are the coefficients of what is left.'},
  {d:'Factor what is left',m:'(x \u2212 3)(x + 2)',w:'Two numbers that multiply to \u22126 and add to \u22121.'},
  {d:'List every zero',m:'x = 1, x = 3, x = \u22122',w:'Each of the three factors gives one zero. Degree 3 means three zeros.'},
  {d:'Sketch it',m:'',w:'Positive leading coefficient: starts low, ends high, crosses at \u22122, 1, and 3.',viz:svgWrap(mkG(360,240,-4,5,-10,10),(g=>axes(g)+curve(g,x=>(x-1)*(x-3)*(x+2),'cv')+pt(g,-2,0)+pt(g,1,0)+pt(g,3,0))(mkG(360,240,-4,5,-10,10)),'Graph with zeros at -2, 1, 3')}]},
 qs:[
  {id:'4a',t:'mc',q:'What is the end behavior of f(x) = \u22122x\u2074 + x \u2212 1?',o:['Both ends go up','Both ends go down','Left up, right down','Left down, right up'],a:1,hint:'Look only at the leading term: even degree, negative coefficient.',sol:'\u22122x\u2074 is an upside-down U shape, so both ends go down.'},
  {id:'4b',t:'mc',q:'f(x) = (x \u2212 1)\u00B2(x + 3). At x = 1, the graph\u2026',o:['crosses the x-axis','touches the x-axis and turns around','has a vertical asymptote','is undefined'],a:1,hint:'The factor (x \u2212 1) is squared. What does even multiplicity do?',sol:'Multiplicity 2 means the graph touches and bounces back.'},
  {id:'4c',t:'num',q:'What is the remainder when x\u00B3 \u2212 2x + 5 is divided by x \u2212 2?',a:[9],hint:'Remainder Theorem: just compute f(2).',sol:'f(2) = 8 \u2212 4 + 5 = 9.'},
  {id:'4d',t:'mc',q:'Which is NOT a possible rational zero of 3x\u00B3 + x\u00B2 \u2212 5x + 2?',o:['2/3','1/3','3/2','\u22122'],a:2,hint:'Possible zeros are factors of 2 over factors of 3.',sol:'The list is \u00B11, \u00B12, \u00B11/3, \u00B12/3. 3/2 has 3 on top, which is not a factor of 2.'},
  {id:'4e',t:'num',q:'How many complex zeros (counting multiplicity) does a degree-5 polynomial have?',a:[5],hint:'Fundamental Theorem of Algebra.',sol:'A degree n polynomial has exactly n zeros, counting repeats and complex ones.'},
  {id:'4f',t:'self',q:'Find all zeros of x\u00B3 \u2212 x\u00B2 \u2212 4x + 4.',ans:'x = 1, x = 2, x = \u22122',hint:'Four terms: factor by grouping.',sol:'x\u00B2(x \u2212 1) \u2212 4(x \u2212 1) = (x \u2212 1)(x\u00B2 \u2212 4) = (x \u2212 1)(x \u2212 2)(x + 2).'}]},

 glyph:G(`<line x1="60" y1="2" x2="60" y2="68" stroke="var(--c1)" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="4" y1="36" x2="116" y2="36" stroke="var(--c5)" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M64 4 Q66 34 112 34" ${st('var(--c5)',4.5)}/><path d="M56 66 Q54 38 8 38" ${st('var(--c5)',4.5)}/>`),

  {h:'Walls vs. holes',cards:[
   {t:'Factor first',f:'(x\u00B2 \u2212 4)/(x\u00B2 \u2212 x \u2212 2) = (x \u2212 2)(x + 2)/((x \u2212 2)(x + 1))',n:'You cannot see the features until everything is factored.'},
   {t:'A factor that cancels: hole',f:'x = 2',n:'The factor is gone, so the graph is continuous except for a single missing point. Find its height by plugging into the simplified version.'},
   {t:'A factor that stays on the bottom: wall',f:'x = \u22121',n:'This is a vertical asymptote. The curve shoots up or down next to it.'}]},
  {h:'Horizontal asymptote: compare the degrees',cards:[
   {t:'Top smaller than bottom',f:'y = 0',n:'The bottom wins, so the fraction shrinks to zero.',ex:'(x + 5)/(x\u00B2 + 1)'},

   {t:'Top is exactly 1 bigger',f:'slant asymptote',n:'Do long division. The quotient (without the remainder) is the slanted line.',ex:'(x\u00B2 + 1)/(x \u2212 1): y = x + 1'},
   {t:'Top is 2 or more bigger',f:'no horizontal asymptote',n:'The graph grows without leveling off.'}]},
  {h:'Intercepts',cards:[
   {t:'x-intercepts',f:'zeros of the top that stayed',n:'Set the simplified numerator equal to 0.'},
   {t:'y-intercept',f:'f(0)',n:'Plug in 0. If the bottom is 0 there, there is no y-intercept.'}]}],
 flow:[['Step 1','Factor top and bottom'],['Step 2','Cancel: holes'],['Step 3','What is left on the bottom: walls'],['Step 4','Compare degrees: horizontal / slant'],['Step 5','Find the intercepts'],['Step 6','Sketch']],

  {d:'Cancel the common factor: a hole',m:'hole at x = 2',w:'Plug 2 into what is left, (x + 2)/(x + 1): that gives 4/3. The hole is at (2, 4/3).'},
  {d:'What stays on the bottom: a wall',m:'vertical asymptote x = \u22121',w:'(x + 1) did not cancel, so x = \u22121 is a wall.'},
  {d:'Compare degrees',m:'horizontal asymptote y = 1',w:'Both degree 2, so divide the leading coefficients: 1/1 = 1.'},
  {d:'Intercepts',m:'x-intercept (\u22122, 0)   y-intercept (0, 2)',w:'The remaining numerator x + 2 is zero at \u22122. f(0) = \u22124/\u22122 = 2.'},
  {d:'Sketch it',m:'',w:'Walls and level line first, then the curve, then the open hole.',viz:svgWrap(mkG(400,280,-6,6,-6,6),(g=>axes(g)+vline(g,-1)+hline(g,1)+curve(g,x=>(x+2)/(x+1),'cv',{jump:.5,n:700})+pt(g,2,4/3,true)+pt(g,-2,0)+pt(g,0,2))(mkG(400,280,-6,6,-6,6)),'Graph with hole at (2, 4/3)')}]},
 qs:[
  {id:'5a',t:'mc',q:'What is the vertical asymptote of f(x) = (x + 1)/(x \u2212 4)?',o:['x = \u22121','x = 4','y = 1','There is none'],a:1,hint:'Where is the bottom zero (and nothing cancels)?',sol:'x \u2212 4 = 0 gives x = 4.'},
  {id:'5b',t:'mc',q:'f(x) = (x \u2212 3)/(x\u00B2 \u2212 9). What features does it have?',o:['Hole at x = 3, vertical asymptote at x = \u22123','Vertical asymptotes at x = 3 and x = \u22123','Hole at x = \u22123, vertical asymptote at x = 3','Holes at x = 3 and x = \u22123'],a:0,hint:'Factor the bottom: x\u00B2 \u2212 9 = (x \u2212 3)(x + 3). What cancels?',sol:'(x \u2212 3) cancels, leaving a hole at x = 3. (x + 3) stays on the bottom: wall at x = \u22123.'},
  {id:'5c',t:'mc',q:'What is the horizontal asymptote of (4x\u00B2 + 1)/(2x\u00B2 \u2212 7)?',o:['y = 0','y = 2','y = 4','None'],a:1,hint:'Same degree: divide the leading coefficients.',sol:'4/2 = 2, so y = 2.'},
  {id:'5d',t:'mc',q:'What is the horizontal asymptote of (x + 5)/(x\u00B2 + 1)?',o:['y = 0','y = 1','y = 5','None'],a:0,hint:'Compare the degrees: top 1, bottom 2.',sol:'The bottom has the bigger degree, so the fraction shrinks to y = 0.'},
  {id:'5e',t:'num',q:'What is the y-intercept of f(x) = (x \u2212 6)/(x + 2)?',a:[-3],hint:'The y-intercept is f(0).',sol:'f(0) = (0 \u2212 6)/(0 + 2) = \u22123.'},
  {id:'5f',t:'self',q:'Find the slant asymptote of f(x) = (x\u00B2 + 1)/(x \u2212 1).',ans:'y = x + 1',hint:'Top degree is exactly one bigger: do long division and ignore the remainder.',sol:'x\u00B2 + 1 \u00F7 (x \u2212 1) = x + 1 with remainder 2. The slant asymptote is y = x + 1.'}]},

{id:'t6',n:'Exponentials & logs',goal:'Exponentials grow fast. A logarithm asks: what power do I need?',
 glyph:G(`<path d="M8 60 Q60 58 90 10" ${st('var(--c6)')}/><path d="M12 62 Q14 14 66 10" ${st('var(--c1)',4)}/><line x1="8" y1="64" x2="62" y2="8" stroke="var(--mute)" stroke-width="2" stroke-dasharray="4 5"/>`),
 widget:'t6',
 notice:['Try b below 1. The exponential flips from growth to decay.','The log is the exponential reflected over the dashed line.','Notice the points: (0, 1) becomes (1, 0).'],
 rules:[
  {h:'A log is an exponent question',cards:[
   {t:'Two ways to say the same thing',f:'log\u2082 8 = 3  \u21D4  2\u00B3 = 8',n:'Read log\u2082 8 as: 2 to what power gives 8? The log is the exponent.'},
   {t:'Two powerful facts',f:'log\u2090(1) = 0 and log\u2090(a) = 1',n:'Any base to the 0 is 1. Any base to the 1 is itself.'},
   {t:'Domain',f:'log\u2090(x) needs x > 0',n:'You can never take the log of zero or a negative. Always check your answers.'}]},
  {h:'Three log properties',cards:[
   {t:'Product: becomes a sum',f:'log(MN) = log M + log N',n:'Multiplying inside means adding outside.'},
   {t:'Quotient: becomes a difference',f:'log(M/N) = log M \u2212 log N',n:'Dividing inside means subtracting outside.'},
   {t:'Power: comes to the front',f:'log(M\u1D56) = p \u00B7 log M',n:'An exponent hops to the front as a multiplier.'},
   {t:'Change of base',f:'log\u2090 x = ln x / ln a',n:'Lets you compute any log on a calculator.'}]},
  {h:'Money and growth',cards:[
   {t:'Compound interest',f:'A = P(1 + r/n)^(nt)',n:'P = start, r = rate as a decimal, n = times per year, t = years.'},
   {t:'Continuous',f:'A = Pe^(rt)',n:'Used when growth happens continuously. Also the model for growth and decay.'}]}],
 flow:[['Same base?','Set exponents equal'],['Different bases?','Take ln of both sides'],['Then','Bring the exponent down'],['Logs in the equation?','Combine into one log'],['Then','Rewrite as an exponential'],['Always','Check the log domain']],
 ex:{title:'Solve 3^(x + 1) = 20',steps:[
  {d:'Different bases, so take the natural log of both sides',m:'ln(3^(x + 1)) = ln 20',w:'Whatever you do to one side you must do to the other.'},
  {d:'Bring the exponent down',m:'(x + 1) \u00B7 ln 3 = ln 20',w:'Power property of logs.'},
  {d:'Divide by ln 3',m:'x + 1 = ln 20 / ln 3 \u2248 2.727',w:'ln 3 is just a number, about 1.0986.'},
  {d:'Subtract 1',m:'x \u2248 1.727',w:'Now x is alone.'},
  {d:'Check',m:'3^2.727 \u2248 20 \u2713',w:'Quick check on a calculator.'}]},
 qs:[
  {id:'6a',t:'mc',q:'What is log\u2082 32?',o:['4','5','6','16'],a:1,hint:'2 to what power equals 32?',sol:'2\u2075 = 32, so log\u2082 32 = 5.'},
  {id:'6b',t:'mc',q:'Which is log\u2085 25 = 2 written in exponential form?',o:['2\u2075 = 25','5\u00B2 = 25','25\u2075 = 2','5\u00B2\u2075 = 2'],a:1,hint:'The base of the log is the base of the power. The answer to the log is the exponent.',sol:'Base 5, exponent 2: 5\u00B2 = 25.'},
  {id:'6c',t:'mc',q:'log(x) + log(5) equals\u2026',o:['log(x + 5)','log(5x)','5 log x','log(x) \u00B7 log(5)'],a:1,hint:'Adding logs means multiplying inside.',sol:'Product property: log x + log 5 = log(5x).'},
  {id:'6d',t:'num',q:'Solve 2^(x \u2212 1) = 16.',a:[5],hint:'Write 16 as a power of 2.',sol:'16 = 2\u2074, so x \u2212 1 = 4 and x = 5.'},
  {id:'6e',t:'num',q:'Solve log\u2083(x + 1) = 2.',a:[8],hint:'Rewrite in exponential form: 3\u00B2 = x + 1.',sol:'3\u00B2 = 9 = x + 1, so x = 8.'},
  {id:'6f',t:'self',q:'Solve ln(x) + ln(x \u2212 2) = ln 8.',ans:'x = 4',hint:'Combine the left side into one log, then drop the ln from both sides. Check the domain!',sol:'ln(x(x \u2212 2)) = ln 8, so x\u00B2 \u2212 2x = 8, x\u00B2 \u2212 2x \u2212 8 = 0, giving x = 4 or x = \u22122. x = \u22122 makes ln(x) undefined, so reject it. x = 4.'}]},

{id:'t7',n:'Systems',goal:'Where do two graphs meet? The meeting points are the solutions.',
 glyph:G(`<line x1="10" y1="62" x2="104" y2="8" ${st('var(--c7)',5)}/><line x1="10" y1="14" x2="106" y2="60" ${st('var(--ink)',4)}/><circle cx="58" cy="36" r="7" fill="var(--c7)" stroke="var(--card)" stroke-width="3"/>`),

  {h:'Three possible outcomes for two lines',cards:[
   {t:'One solution',f:'different slopes',n:'The lines cross at a single point.',viz:mini([[x=>x,'cv'],[x=>-x/2+1,'cv3']])},
   {t:'No solution',f:'same slope, different intercept',n:'Parallel lines. You will get a false statement like 0 = 5.',viz:mini([[x=>x+1,'cv'],[x=>x-1,'cv3']])},

  {h:'Two methods',cards:[
   {t:'Substitution',f:'solve one equation for a variable, plug it in',n:'Best when one equation already has x or y alone. Also the go-to for nonlinear systems.'},
   {t:'Elimination',f:'add the equations to cancel a variable',n:'Best when both equations are in the form Ax + By = C. Multiply first to make a variable cancel.'},
   {t:'Always finish',f:'plug back in to find the other variable',n:'A solution is a point (x, y). Check it in both equations.'}]}],

  {d:'Plan: eliminate y',m:'multiply the second equation by 3',w:'That makes the y terms \u22123y and +3y, which cancel when we add.'},
  {d:'Multiply',m:'12x \u2212 3y = 30',w:'Every term gets multiplied, including the right side.'},
  {d:'Add the equations',m:'(2x + 3y) + (12x \u2212 3y) = 12 + 30  \u2192  14x = 42',w:'The y terms cancel.'},
  {d:'Solve for x',m:'x = 3',w:'Divide both sides by 14.'},
  {d:'Plug back in to find y',m:'4(3) \u2212 y = 10  \u2192  y = 2',w:'Use whichever original equation is easier.'},
  {d:'The solution is a point',m:'(3, 2)',w:'This is where the two lines cross.',viz:svgWrap(mkG(300,260,-2,7,-3,7),(g=>axes(g)+curve(g,x=>(12-2*x)/3,'cv')+curve(g,x=>4*x-10,'cv3')+pt(g,3,2))(mkG(300,260,-2,7,-3,7)),'Lines cross at (3, 2)')}]},
 qs:[
  {id:'7a',t:'mc',q:'Solve y = 2x \u2212 1 and y = \u2212x + 5.',o:['(1, 4)','(2, 3)','(3, 2)','(\u22122, 7)'],a:1,hint:'Both equal y, so set them equal to each other.',sol:'2x \u2212 1 = \u2212x + 5 gives x = 2, then y = 3.'},
  {id:'7b',t:'mc',q:'How many solutions: y = 3x + 1 and y = 3x \u2212 4?',o:['One','None','Infinitely many','Two'],a:1,hint:'Compare the slopes and the intercepts.',sol:'Same slope (3), different intercepts: parallel lines that never meet.'},

  {id:'7d',t:'num',q:'Solve 3x + y = 11 and x \u2212 y = 1. What is y?',a:[2],hint:'Add the equations to cancel y, solve for x, then go back for y.',sol:'4x = 12 so x = 3. Then 3 \u2212 y = 1 gives y = 2.'},

  {id:'7f',t:'self',q:'Solve x\u00B2 + y\u00B2 = 25 and y = x + 1.',ans:'(3, 4) and (\u22124, \u22123)',hint:'Substitute y = x + 1 into the circle equation.',sol:'x\u00B2 + (x + 1)\u00B2 = 25 gives 2x\u00B2 + 2x \u2212 24 = 0, so x\u00B2 + x \u2212 12 = 0, x = 3 or x = \u22124. Then y = 4 or y = \u22123.'}]}
];

function hstr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){
  let s=seed>>>0;
  const nx=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
  const R={f:nx,i:(a,b)=>a+Math.floor(nx()*(b-a+1)),pick:a=>a[Math.floor(nx()*a.length)],sign:()=>nx()<.5?-1:1,
    nz:(a,b)=>{let v=0;while(v===0)v=a+Math.floor(nx()*(b-a+1));return v;},
    shuffle:a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(nx()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;}return r;}};
  nx();nx();return R;
}
const SUPD='\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079',SUBD='\u2080\u2081\u2082\u2083\u2084\u2085\u2086\u2087\u2088\u2089';
const sup=n=>String(n).split('').map(c=>c==='-'?'\u207B':SUPD[+c]).join('');
const sub=n=>String(n).split('').map(c=>SUBD[+c]).join('');

}

  if(!DB||tutorSub)return;tutorSub=true;

    if(USER)USER.profiles(tutorDocs.map(d=>d.id)).then(ps=>{names={};Object.keys(ps||{}).forEach(k=>{names[k]=ps[k].name||'';});if(view==='tutor')render();}).catch(()=>{});

function summary(){
  const L=['MAT 171 progress: '+allDone()+' of '+QTOTAL+' questions solved'];
  TOP.forEach(t=>{const c=S.conf[t.id];L.push(t.n+': '+topicDone(t)+' of '+t.qs.length+(c?' ('+({g:'feels clear',y:'a bit shaky',r:'feeling lost'})[c]+')':''));});
  const miss=[],retry=[];
  TOP.forEach(t=>t.qs.forEach(q=>{const r=S.q[q.id];if(!r)return;if(!qdone(q.id)&&(r.tries>0||r.self==='missed'))miss.push(t.n+': '+q.q);else if(qdone(q.id)&&(r.wrong||0)>0)retry.push(t.n+': '+q.q);}));

/* ---------- write powers and fractions properly ---------- */
const TOKC=/[0-9A-Za-z.\u00B9\u00B2\u00B3\u2070-\u209F\u1D2C-\u1D6A\u221A\u221B\u221C\u03C0]/;
function splitSup(s){const out=[];let buf='',i=0;
  while(i<s.length){const c=s[i];
    if(c==='^'){const j=i+1;let ex='',ni=i;
      if(s[j]==='('){let d=0,k=j;for(;k<s.length;k++){if(s[k]==='(')d++;else if(s[k]===')'){d--;if(d===0)break;}}if(k<s.length){ex=s.slice(j+1,k);ni=k+1;}}
      else{const m=/^[-\u2212]?[0-9A-Za-z.]+/.exec(s.slice(j));if(m){ex=m[0].replace(/\.+$/,'');ni=j+ex.length;}}
      if(ex){if(buf)out.push(buf);buf='';out.push({s:ex});i=ni;continue;}}
    buf+=c;i++;}
  if(buf)out.push(buf);return out;}
const WORD=/[A-Za-z]{3,}/,MATHW=s=>s.replace(/\b(log|ln|sin|cos|tan)\b/g,'');
function pgrp(s,k,dir){let d=0;if(dir<0){for(;k>=0;k--){if(s[k]===')')d++;else if(s[k]==='('){d--;if(d===0)return k;}}return -1;}
  for(;k<s.length;k++){if(s[k]==='(')d++;else if(s[k]===')'){d--;if(d===0)return k;}}return -1;}
function leftOp(s,a){let L=a+1,k=a;
  while(k>=0){
    if(s[k]===')'){const g=pgrp(s,k,-1);if(g<0)return -1;k=g-1;L=g;while(k>=0&&/[A-Za-z\u2080-\u209C]/.test(s[k])){k--;L=k+1;}continue;}
    if(TOKC.test(s[k])){while(k>=0&&TOKC.test(s[k]))k--;L=k+1;continue;}
    if(/[\u221A\u221B\u221C\u00B7]/.test(s[k])&&L<=a){k--;L=k+1;continue;}
    break;}
  if(L>a)return -1;
  if((s[L-1]==='\u2212'||s[L-1]==='-')&&(L-1===0||/[ (=]/.test(s[L-2])))L--;
  return L;}

  {d:"Clear the denominators",m:"6x + 3 = A(x − 2) + B(x + 1)",w:"Multiply both sides by (x + 1)(x − 2)."},
  {d:"Let x = −1",m:"−3 = A(−3), so A = 1",w:"The B term becomes zero."},
  {d:"Let x = 2",m:"15 = B(3), so B = 5",w:"The A term becomes zero."},
  {d:"Write the answer",m:"1/(x + 1) + 5/(x − 2)",w:"Check by adding the fractions back together."}]},
 {title:"Costs are C(x) = 1920 + 4x and revenue is R(x) = 12x. Find the break-even point.",steps:[
  {d:"Set revenue equal to cost",m:"12x = 1920 + 4x",w:"Break-even means no profit and no loss."},
  {d:"Solve",m:"8x = 1920, so x = 240 items",w:"Subtract 4x from both sides, then divide."},
  {d:"Interpret",m:"Sell more than 240 to make a profit",w:"Below 240, cost is higher than revenue."}]}]);

/* exam-style practice: which mock-final question types belong to which topic */
const FTID=['t2','t2','t2','t2','t2','t2','t2','t3','t3','t3','t3','t3','t3','t3','t3','t3','t7','t4','t4','t4','t2','t1','t4','t7','t7','t4','t4','t4','t4','t4','t5','t5','t5','t3','t3','t6','t6','t6','t6','t6'];
if(typeof FG!=='undefined'&&FG.length===FTID.length)FG.forEach((g,i)=>{g[1]=FTID[i];});
})();

const FKEY='mat171-final-v1',FMIN=120,FL='ABCD';
let F=null;try{const r=localStorage.getItem(FKEY);if(r)F=JSON.parse(r);}catch(e){F=null;}
function fSave(){try{localStorage.setItem(FKEY,JSON.stringify(F));}catch(e){}}
function fSeeds(){const R=rng((Date.now()^Math.floor(Math.random()*4294967295))>>>0);return FG.map((_,i)=>({g:i,seed:R.i(1,2147483646)}));}
function fNew(keepHist){const h=F&&F.hist&&keepHist?F.hist:[];F={items:fSeeds(),ans:{},flag:{},start:0,end:0,done:false,hist:h,missOnly:false};fSave();}
const fCache={};
function fQ(i){const it=F.items[i],k=it.g+':'+it.seed;if(fCache[k])return fCache[k];const g=FG[it.g];let q;
  try{q=g[2](rng(it.seed));}catch(e){q={q:'This question could not be generated. Skip it.',o:['A','B','C','D'],a:0,sol:''};}
  q.sec=g[0];q.tid=g[1];return fCache[k]=q;}
const fLeft=()=>Math.max(0,F.start+FMIN*60000-Date.now());
const hms=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');};
const fUsed=()=>{const ms=Math.min(FMIN*60000,(F.end||Date.now())-F.start);const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min';};
const fAnsN=()=>F.items.filter((_,i)=>F.ans[i]!=null).length;
const fFlagN=()=>F.items.filter((_,i)=>F.flag[i]).length;
const letter=p=>p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';
let fArm=false;
function fFinish(){if(F.done)return;F.done=true;F.end=Math.min(Date.now(),F.start+FMIN*60000);fArm=false;F.missOnly=false;
  let c=0;F.items.forEach((_,i)=>{if(F.ans[i]===fQ(i).a)c++;});F.hist=(F.hist||[]).concat([{c,n:F.items.length,t:fUsed(),d:Date.now()}]);fSave();}
function fQBlock(i,res){const q=fQ(i),a=F.ans[i],ok=res&&a===q.a,t=TOP.find(x=>x.id===q.tid)||TOP[0];
  if(res&&F.missOnly&&ok)return '';
  const opts=`<div class="opts">${q.o.map((o,j)=>{let c='';if(res){if(j===q.a)c=' right';else if(j===a)c=' wrong';}else if(j===a)c=' sel';
    return `<button class="opt${c}" data-act="fpick" data-i="${i}" data-v="${j}" aria-pressed="${j===a}" ${res?'disabled':''}><span class="lt">${FL[j]}</span><span>${esc(o)}</span></button>`;}).join('')}</div>`;
  let fb='';if(res){fb=ok?`<div class="fb ok"><b>Correct.</b> ${esc(q.sol)}</div>`:`<div class="fb bad"><b>${a==null?'Not answered.':'Incorrect.'}</b> The correct answer is ${FL[q.a]}.</div><div class="fb hint"><b>How it works:</b> ${esc(q.sol)}</div>`;}
  const flag=res?'':`<button class="fflag${F.flag[i]?' on':''}" data-act="fflag" data-i="${i}" aria-pressed="${!!F.flag[i]}">${F.flag[i]?'⚑ Flagged':'⚐ Flag for review'}</button>`;
  return `<div class="q fq${res?(ok?' ok':' bad'):''}" id="fq-${i}" style="${tcStyle(t)};--tcd:var(--ink)"><div class="fqh"><span class="tnum" style="--tcd:var(--mute)">Question ${i+1}${res?' · '+esc((FSEC.find(s=>s.id===q.sec)||{}).n||''):''}</span>${flag}</div><p class="qt">${esc(q.q)}</p>${opts}${fb}</div>`;}
function fNav(){return `<div class="fnav" aria-label="Question map">${F.items.map((_,i)=>`<button class="${F.ans[i]!=null?'an':''}${F.flag[i]?' fl':''}" data-act="fjump" data-i="${i}" aria-label="Question ${i+1}${F.ans[i]!=null?', answered':''}${F.flag[i]?', flagged':''}">${i+1}</button>`).join('')}</div>`;}
function renderFinal(){
  if(!F||!F.items||F.items.length!==FG.length)fNew(true);
  if(F.start&&!F.done&&fLeft()<=0)fFinish();
  const back=`<button class="back" data-act="home">‹ All topics</button>`;
  const hist=(F.hist||[]);
  if(!F.start){
    const cov=FSEC.map(s=>{const idx=FG.map((g,i)=>g[0]===s.id?i+1:0).filter(Boolean);return `<tr><td>${esc(s.n)}</td><td class="n">${idx[0]}–${idx[idx.length-1]}</td><td class="n">${idx.length}</td></tr>`;}).join('');
    return back+`<section class="hero" style="padding-top:6px"><h1 style="max-width:none">Mock final exam</h1><p>MAT 171 Precalculus Algebra · set out like the CPCC final: 40 multiple-choice questions covering the whole course, 2 hours.</p></section>
    <div class="tcard main fcover"><h3>Instructions</h3><ul>
      <li><b>40 questions, 2 hours.</b> Each question is worth 2.5 points, for 100 points in total.</li>
      <li>Choose the one best answer for each question. Work it out on paper first, the way you would in the exam room.</li>
      <li>About a third of the questions are word problems: building a model from a situation, then using it to answer a question or make a prediction.</li>
      <li>Use the calculator your instructor allows on the final. No notes.</li>
      <li>You can flag any question and come back to it. The question map shows what you have answered.</li>
      <li>The clock starts when you press Start and keeps running if you leave the page. When time runs out the exam submits itself.</li>
      <li>You get your score, percentage, letter grade and feedback straight away. Every retake uses new numbers.</li></ul>
    <h3 style="margin-top:14px">What it covers</h3><div class="ftbl"><table><thead><tr><th>Unit</th><th>Questions</th><th>Count</th></tr></thead><tbody>${cov}</tbody></table></div>
    ${hist.length?`<p style="margin-top:12px">Your attempts so far: ${hist.map((h,k)=>`attempt ${k+1}: ${h.c} of ${h.n} (${Math.round(h.c/h.n*100)}%)`).join(' · ')}</p>`:''}
    <div class="tsub" style="--tcd:var(--d5)"><button class="btn fill" data-act="fstart">Start the mock final (2 hours)</button></div></div>`;}
  if(!F.done){
    const left=F.items.length-fAnsN();
    return `<div class="tbar"><span class="pt">Mock final</span><span class="cnt" id="fcount">${fAnsN()} of 40 answered${fFlagN()?' · '+fFlagN()+' flagged':''}</span><button class="btn fmapb" data-act="fmap">Question map</button><span class="tm${fLeft()<600000?' low':''}" id="fclock" aria-label="Time remaining">${hms(fLeft())}</span></div>
    <div id="fmap">${fNav()}</div>
    <div class="qs">${F.items.map((_,i)=>fQBlock(i,false)).join('')}</div>
    <div class="tsub" style="--tcd:var(--d5)"><button class="btn fill" data-act="fsub">${fArm?'Submit anyway':'Submit the exam'}</button><span style="color:var(--mute)" id="fsubmsg">${fArm&&(left||fFlagN())?`${left?left+' unanswered (marked wrong)':''}${left&&fFlagN()?' and ':''}${fFlagN()?fFlagN()+' still flagged':''}. Press again to submit.`:'Answers save as you go.'}</span></div>`;}
  let c=0;const by={};F.items.forEach((_,i)=>{const q=fQ(i),ok=F.ans[i]===q.a;if(ok)c++;const b=by[q.sec]||(by[q.sec]={n:0,c:0});b.n++;if(ok)b.c++;});
  const n=F.items.length,pct=Math.round(c/n*100),pts=(c*2.5).toFixed(1).replace(/\.0$/,''),fb0=fbBand(pct),fb={h:fb0.h,c:fb0.c,m:fb0.m.replace(/this part/g,'the mock final').replace(/red topics?/g,m=>m.replace('topic','unit'))};
  let cmp='';if(hist.length>1){const pv=hist[hist.length-2],d=pct-Math.round(pv.c/pv.n*100);cmp=`<p style="margin-top:8px">${d>0?`Up ${d} percentage points from your last attempt.`:d<0?`Down ${-d} percentage points from your last attempt.`:'Same percentage as your last attempt.'}</p>`;}
  const secs=FSEC.map(s=>{const b=by[s.id]||{n:0,c:0};const t=TOP.find(x=>x.id===s.tid)||TOP[0];return `<a href="#${s.tid}-try" class="${b.c<b.n?'weak':''}" style="${tcStyle(t)}"><b>${esc(s.n)}</b>${b.c} of ${b.n} correct (${b.n?Math.round(b.c/b.n*100):0}%)</a>`;}).join('');
  const weak=FSEC.filter(s=>by[s.id]&&by[s.id].c<by[s.id].n).sort((x,y)=>by[x.id].c/by[x.id].n-by[y.id].c/by[y.id].n).slice(0,2).map(s=>s.n);
  return back+`<section class="hero" style="padding-top:6px"><h1 style="max-width:none">Mock final results</h1></section>
  <div class="tcard main"><div class="tnum" style="--tcd:var(--d5)">Your score · finished in ${fUsed()}</div>
   <div class="fscore"><div><div class="big">${pts} <small>/ 100 points</small></div><p style="margin:0">${c} of ${n} correct · ${pct}%</p></div><div class="fgrade" aria-label="Letter grade ${letter(pct)}">${letter(pct)}</div></div>
   <div class="fbk" style="--fbc:${fb.c}"><b>${fb.h}.</b> ${fb.m}</div>${cmp}
   <p style="margin-top:12px">${weak.length?`<b>Focus next on:</b> ${weak.join(' and ')}. Tap a unit in red to practise it.`:'Every unit fully correct.'} Letter grade uses the usual 90 / 80 / 70 / 60 scale.</p>
   <div class="tbt">${secs}</div>
   <div class="tsub" style="--tcd:var(--d5)"><button class="btn fill" data-act="fretake">Retake with new numbers</button><button class="btn" data-act="fmiss">${F.missOnly?'Show all 40 questions':'Show only questions I missed'}</button></div></div>
  <h3 class="gh">${F.missOnly?'Questions you missed':'Every question with feedback'}</h3><div class="qs">${F.items.map((_,i)=>fQBlock(i,true)).join('')||'<p>You did not miss any questions.</p>'}</div>`;
}
setInterval(()=>{if(view!=='final'||!F||!F.start||F.done)return;const ms=fLeft();if(ms<=0){fFinish();render();window.scrollTo(0,0);return;}
  const c=document.getElementById('fclock');if(c){c.textContent=hms(ms);c.classList.toggle('low',ms<600000);}},1000);
function fRefreshBar(){const c=document.getElementById('fcount');if(c)c.textContent=`${fAnsN()} of 40 answered${fFlagN()?' · '+fFlagN()+' flagged':''}`;
  const nav=document.getElementById('fmap');if(nav)nav.innerHTML=fNav();}

/* ---------- answer checking ---------- */
function parseNum(s){
  s=String(s).toLowerCase().replace(/\s+/g,'').replace(/\u2212/g,'-').replace(/^[a-z]=/,'').replace(/,/g,'');
  let m=/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/.exec(s);if(m)return parseFloat(m[1])/parseFloat(m[2]);
  if(/^-?\d*\.?\d+$/.test(s))return parseFloat(s);return NaN;
}
function findQ(id){for(const t of TOP)for(const q of t.qs)if(q.id===id)return{t,q};return null;}
function rec(id){return S.q[id]||(S.q[id]={});}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='home')return go('home');
  if(a==='tutor')return go('tutor');
  if(a==='topic'){return go(b.dataset.id,'see');}
  if(a==='tab'){tab=b.dataset.v;return go(view,tab);}
  if(a==='conf'){S.conf[view]=S.conf[view]===b.dataset.v?undefined:b.dataset.v;if(S.conf[view]===undefined)delete S.conf[view];save();return render();}
  if(a==='wex'){wex[view]=+b.dataset.v;return render();}
if(a==='wnext'){walk[wkey(view)]=(walk[wkey(view)]||1)+1;return render();}
  if(a==='wback'){walk[wkey(view)]=Math.max(1,(walk[wkey(view)]||1)-1);return render();}
  if(a==='wall'){walk[wkey(view)]=99;return render();}
  if(a==='wtry'){return go(view,'try');}
  if(a==='share'){shareOpen=!shareOpen;return render();}
  if(a==='copy'){const ta=document.getElementById('sharebox');if(ta){ta.select();let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value);ok=true;}else ok=document.execCommand('copy');}catch(er){try{ok=document.execCommand('copy');}catch(e2){}}b.textContent=ok?'Copied':'Select the text and copy it';}return;}
  if(a==='reset'){if(!resetArm){resetArm=true;return render();}S={q:{},conf:{},last:null,updated:Date.now()};persistLocal();if(dbDoc)queueCloud();resetArm=false;return render();}
  if(a==='xpick'){const i=+b.dataset.i,v=+b.dataset.v,st=xpQ(i);if(!st.q||st.ok)return;if(v===st.q.a)st.ok=true;else{st.wrong=(st.wrong||[]).concat([v]);}
    const el=document.getElementById('xp-'+i);if(el){const k=el.querySelector('.tag').textContent.replace(/\D+/g,'');el.outerHTML=xpBlock(i,k);}return;}
  if(a==='xsol'){const i=+b.dataset.i,st=xpQ(i);st.sol=true;const el=document.getElementById('xp-'+i);if(el){const k=el.querySelector('.tag').textContent.replace(/\D+/g,'');el.outerHTML=xpBlock(i,k);}return;}
  if(a==='xnew'){const i=+b.dataset.i;XP[i]={seed:(Date.now()^Math.floor(Math.random()*4294967295))>>>0};const el=document.getElementById('xp-'+i);if(el){const k=el.querySelector('.tag').textContent.replace(/\D+/g,'');el.outerHTML=xpBlock(i,k);}return;}
  if(a==='test'){return go('test');}
  if(a==='final'){return go('final');}
  if(a==='fstart'){if(!F.start){F.start=Date.now();fSave();}render();window.scrollTo(0,0);return;}
  if(a==='fpick'){if(F.done)return;const i=+b.dataset.i,v=+b.dataset.v;F.ans[i]=v;fArm=false;fSave();
    b.parentNode.querySelectorAll('.opt').forEach(o=>{const on=o===b;o.classList.toggle('sel',on);o.setAttribute('aria-pressed',on);});fRefreshBar();return;}
  if(a==='fflag'){if(F.done)return;const i=+b.dataset.i;F.flag[i]=!F.flag[i];fSave();b.classList.toggle('on',!!F.flag[i]);b.setAttribute('aria-pressed',!!F.flag[i]);b.textContent=F.flag[i]?'\u2691 Flagged':'\u2690 Flag for review';fRefreshBar();return;}
  if(a==='fjump'){const el=document.getElementById('fq-'+b.dataset.i);if(el){const off=(document.querySelector('.tbar')||{offsetHeight:0}).offsetHeight+(document.querySelector('header.top')||{offsetHeight:0}).offsetHeight+12;window.scrollTo(0,el.getBoundingClientRect().top+window.scrollY-off);}return;}
  if(a==='fmap'){window.scrollTo(0,0);return;}
  if(a==='fsub'){if(F.done)return;if((fAnsN()<F.items.length||fFlagN())&&!fArm){fArm=true;const m=document.getElementById('fsubmsg');const left=F.items.length-fAnsN();
      if(m)m.textContent=`${left?left+' unanswered (marked wrong)':''}${left&&fFlagN()?' and ':''}${fFlagN()?fFlagN()+' still flagged':''}. Press again to submit.`;b.textContent='Submit anyway';return;}
    fFinish();render();window.scrollTo(0,0);return;}
  if(a==='fretake'){fNew(true);render();window.scrollTo(0,0);return;}
  if(a==='fmiss'){F.missOnly=!F.missOnly;fSave();render();return;}
  if(a==='tnew'){tFresh();tArm=false;render();window.scrollTo(0,0);return;}
  if(a==='tview'){T.show=null;tSave();render();window.scrollTo(0,0);return;}
  if(a==='tretake'){T.show=null;T.pend=+b.dataset.p;tSave();render();window.scrollTo(0,0);return;}
  if(a==='tcancel'){T.pend=null;tSave();render();window.scrollTo(0,0);return;}
  if(a==='tstart'&&T.pend!=null&&T.parts[T.pend].done){tRetake(T.pend);render();window.scrollTo(0,0);return;}
  if(a==='tstart'){const P=T.parts[T.cur];if(!P.start){P.start=Date.now();tSave();}render();window.scrollTo(0,0);return;}
  if(a==='tpick'){const P=T.parts[T.cur];if(!P||P.done)return;const i=+b.dataset.i,v=+b.dataset.v;P.ans[i]=v;tArm=false;tSave();
    b.parentNode.querySelectorAll('.opt').forEach(o=>{const on=o===b;o.classList.toggle('sel',on);o.setAttribute('aria-pressed',on);});
    const l=document.getElementById('tleft');if(l)l.textContent=`${tAns(P)} of ${P.items.length} answered`;return;}
  if(a==='tsub'){const P=T.parts[T.cur];if(P.done)return;const left=P.items.length-tAns(P);if(left&&!tArm){tArm=true;return render();}
    tFinish(T.cur);render();window.scrollTo(0,0);return;}
  const qid=b.dataset.q;const f=qid&&findQ(qid);
  if(!f)return;const r=rec(qid);const q=eff(f.q,r);
  const redo=()=>{const el=$('#q-'+qid);if(el){const tmp=document.createElement('div');tmp.innerHTML=renderQ(f.t,f.q);el.replaceWith(tmp.firstElementChild);}};
  if(a==='pick'){r.pick=parseInt(b.dataset.v,10);r.tries=(r.tries||0)+1;r.ok=r.pick===q.a;if(!r.ok)r.wrong=(r.wrong||0)+1;save();redo();}
  else if(a==='check'){const inp=document.querySelector(`input[data-q="${qid}"]`);const v=inp?inp.value:'';if(!v.trim())return;r.val=v;r.tries=(r.tries||0)+1;const n=parseNum(v);r.ok=!isNaN(n)&&q.a.some(x=>Math.abs(x-n)<1e-6);if(!r.ok)r.wrong=(r.wrong||0)+1;save();redo();}
  else if(a==='hint'){r.hint=true;save();redo();}
  else if(a==='sol'){r.sol=true;save();redo();}
  else if(a==='reveal'){r.rev=true;save();redo();}
  else if(a==='self'){r.self=b.dataset.v;if(r.self==='missed')r.wrong=(r.wrong||0)+1;save();redo();}
  else if(a==='newq'){const was=!!(r.ok||r.self==='got');S.q[qid]={seed:(r.seed||0)+1,right:(r.right||0)+(was?1:0),ever:!!(r.ever||was),wrong:r.wrong||0};save();redo();}
  if(a==='pick'||a==='check'||a==='self'||a==='newq'){/* update progress count text */const lead=document.querySelector('.tview .lead');if(lead&&f.t)lead.textContent=`${topicDone(f.t)} of ${f.t.qs.length} solved. Wrong answers are fine, they save too so you can see what to review. Tap New numbers for the same kind of question with different numbers.`;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.ans input')){const b=document.querySelector(`[data-act="check"][data-q="${e.target.dataset.q}"]`);if(b)b.click();}
});
window.addEventListener('hashchange',()=>{fromHash();render();});

/* ---------- start ---------- */
fromHash();setPill('device');render();mathify(document.body);initCloud();
})();
